name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  github-gateway:
    name: github-gateway
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: github-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: github-gateway/package-lock.json
      - run: npm ci
      - name: Restore script execute bits
        run: chmod +x scripts/*.sh
      - run: npm test

  local-files:
    name: local-files
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: local-files
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: local-files/package-lock.json
      - run: npm ci
      - run: npm test
